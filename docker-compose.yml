services:
  tesla-notifier:
    image: mokoyee/tesla-notifier:latest
    container_name: tesla-notifier
    restart: unless-stopped
    volumes:
      - tesla-notifier-data:/app/data
    environment:
      # 数据库配置（连接 TeslaMate 数据库）
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=teslamate
      - DB_USER=teslamate
      - DB_PASSWORD=teslamate

      # MQTT 配置
      - ENABLE_MQTT=true
      - MQTT_URL=mqtt://mosquitto:1883
      # - MQTT_USERNAME=
      # - MQTT_PASSWORD=

      # 定时任务配置
      - ENABLE_CRON=true
      - DAILY_CRON=0 8 * * *
      - WEEKLY_CRON=0 9 * * mon     
      - MONTHLY_CRON=0 9 1 * *

      # Bark 推送配置
      - BARK_URL=https://api.day.app
      - BARK_KEY=your_bark_key
      # 车辆配置
      - CAR_ID=1
      - MIN_TRIP_DISTANCE=1

      # 时区
      - TZ=Asia/Shanghai
    networks:
      - teslamate_default

networks:
  teslamate_default:
    external: true

volumes:
  tesla-notifier-data:
